<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLP 任务搜索</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #0969da; --hover: #f6f8fa; --mark: #fff3b0;
    --ok: #1a7f37; --bad: #cf222e; --warn: #9a6700;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --border: #30363d;
      --accent: #4493f8; --hover: #161b22; --mark: #5a4a0f;
      --ok: #3fb950; --bad: #f85149; --warn: #d29922;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .sync { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .sync .fail { color: var(--bad); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input, select, button {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
  }
  #q { flex: 1 1 320px; font-size: 16px; padding: 8px 12px; }
  #q:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  select { max-width: 200px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  .summary { font-size: 13px; color: var(--muted); margin-bottom: 4px; min-height: 20px; }
  .summary.error { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); }
  tbody tr:hover { background: var(--hover); }
  td.name { word-break: break-all; }
  td.name a { color: var(--accent); text-decoration: none; }
  td.name a:hover { text-decoration: underline; }
  .nowrap { white-space: nowrap; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .state { font-size: 12px; color: var(--muted); }
  .state::before { content: "●"; margin-right: 4px; }
  .state.Completed { color: var(--ok); }
  .state.Failed { color: var(--bad); }
  .state.Running { color: var(--accent); }
  .state.Stopped { color: var(--warn); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .pager { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 16px; color: var(--muted); }
  @media (max-width: 640px) {
    .col-creator, .col-time { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>MLP 任务搜索</h1>
    <div class="sync">
      <span id="sync-text">…</span>
      <button id="sync-btn" type="button">立即同步</button>
    </div>
  </header>

  <div class="controls">
    <input id="q" type="search" placeholder="输入任务名中的任意片段，多个词用空格分隔" autocomplete="off" autofocus>
    <select id="state"><option value="">全部状态</option></select>
    <select id="creator"><option value="">全部创建人</option></select>
  </div>

  <div id="summary" class="summary"></div>
  <table>
    <thead>
      <tr><th>任务名</th><th>状态</th><th class="col-creator">创建人</th><th class="col-time">创建时间</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="pager" class="pager" hidden>
    <button id="prev" type="button">上一页</button>
    <span id="page"></span>
    <button id="next" type="button">下一页</button>
  </div>
</main>

<script>
const PAGE_SIZE = 50;
const $ = (id) => document.getElementById(id);
const query = { q: "", state: "", creator: "", offset: 0 };
let searchSeq = 0;
let debounceTimer;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 把任务名中命中关键词的部分包上 <mark>，不区分大小写
function highlight(name, q) {
  const lower = name.toLowerCase();
  const ranges = [];
  for (const kw of q.toLowerCase().split(/\s+/).filter(Boolean)) {
    for (let i = lower.indexOf(kw); i !== -1; i = lower.indexOf(kw, i + kw.length)) {
      ranges.push([i, i + kw.length]);
    }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  let html = "", pos = 0;
  for (const [start, end] of ranges) {
    if (end <= pos) continue;
    const s = Math.max(start, pos);
    html += esc(name.slice(pos, s)) + "<mark>" + esc(name.slice(s, end)) + "</mark>";
    pos = end;
  }
  return html + esc(name.slice(pos));
}

function fmtTime(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 当前查询写进地址栏，方便收藏和分享
function syncUrl() {
  const params = new URLSearchParams();
  for (const [k, v] of Object.entries(query)) if (v) params.set(k, v);
  const qs = params.toString();
  history.replaceState(null, "", qs ? "?" + qs : location.pathname);
}

async function search() {
  const seq = ++searchSeq;
  syncUrl();
  try {
    const res = await fetch("/api/tasks?" + new URLSearchParams(query));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if (seq === searchSeq) render(data);  // 丢弃过期的响应，避免快速输入时结果错乱
  } catch (e) {
    if (seq !== searchSeq) return;
    $("summary").textContent = "搜索失败：" + e.message;
    $("summary").className = "summary error";
  }
}

function render({ items, total }) {
  const filtered = query.q || query.state || query.creator;
  $("summary").className = "summary";
  $("summary").textContent = filtered ? `找到 ${total} 个任务` : `共 ${total} 个任务`;

  $("rows").innerHTML = items.length ? items.map((t) => {
    const name = highlight(t.name, query.q);
    const link = t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${name}</a>` : name;
    return `<tr>
      <td class="name">${link}</td>
      <td class="nowrap"><span class="state ${esc(t.state || "")}">${esc(t.state || "-")}</span></td>
      <td class="col-creator nowrap">${esc(t.creator_name || "-")}</td>
      <td class="col-time nowrap">${fmtTime(t.created_at)}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">没有匹配的任务</td></tr>`;

  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const page = Math.floor(query.offset / PAGE_SIZE) + 1;
  $("pager").hidden = pages <= 1;
  $("page").textContent = `${page} / ${pages}`;
  $("prev").disabled = page <= 1;
  $("next").disabled = page >= pages;
}

async function loadFilters() {
  const res = await fetch("/api/filters");
  if (!res.ok) return;
  const { states, creators } = await res.json();
  $("state").insertAdjacentHTML("beforeend", states.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join(""));
  $("creator").insertAdjacentHTML("beforeend", creators.map((c) => `<option value="${esc(c.value)}">${esc(c.name)}</option>`).join(""));
  $("state").value = query.state;
  $("creator").value = query.creator;
}

async function loadSyncStatus() {
  try {
    const s = await (await fetch("/api/sync/status")).json();
    const r = s.last_run;
    const text = $("sync-text");
    text.title = r && r.message ? r.message : "";
    if (s.running) {
      text.textContent = "正在同步…";
    } else if (!r) {
      text.textContent = "尚未同步";
    } else if (r.ok) {
      text.innerHTML = `上次同步 ${fmtTime(r.finished_at)}`;
    } else {
      text.innerHTML = `上次同步 ${fmtTime(r.finished_at)} <span class="fail">失败</span>`;
    }
    $("sync-btn").disabled = s.running;
  } catch {
    $("sync-text").textContent = "无法获取同步状态";
  }
}

async function syncNow() {
  $("sync-btn").disabled = true;
  $("sync-text").textContent = "正在同步…";
  try {
    const res = await fetch("/api/sync", { method: "POST" });
    if (res.status === 409) $("sync-text").textContent = "已有同步正在进行";
  } finally {
    await loadSyncStatus();
    search();
  }
}

function init() {
  const params = new URLSearchParams(location.search);
  query.q = params.get("q") || "";
  query.state = params.get("state") || "";
  query.creator = params.get("creator") || "";
  query.offset = Math.max(0, parseInt(params.get("offset"), 10) || 0);
  $("q").value = query.q;

  $("q").addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      query.q = $("q").value.trim();
      query.offset = 0;
      search();
    }, 250);
  });
  for (const id of ["state", "creator"]) {
    $(id).addEventListener("change", () => {
      query[id] = $(id).value;
      query.offset = 0;
      search();
    });
  }
  $("prev").addEventListener("click", () => { query.offset = Math.max(0, query.offset - PAGE_SIZE); search(); scrollTo(0, 0); });
  $("next").addEventListener("click", () => { query.offset += PAGE_SIZE; search(); scrollTo(0, 0); });
  $("sync-btn").addEventListener("click", syncNow);

  loadFilters();
  loadSyncStatus();
  setInterval(loadSyncStatus, 30000);
  search();
}

init();
</script>
</body>
</html>
